{% extends "blogs/base.html" %}

{% block page_header %}
  <h2>Edit Post</h2>
{% endblock page_header %}

{% block content %}
  <form action="{% url 'blogs:edit_post' post.id %}" method='post'>
    {% csrf_token %}
    {{ form.as_div }}
    <button name="submit" class="btn btn-outline-secondary mt-3">
        Save changes
    </button>
  </form>
{% endblock content %}
