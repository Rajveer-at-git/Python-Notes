{% extends "blogs/base.html" %}

{% block page_header %}
  <h2>New blog</h2>
{% endblock page_header %}

{% block content %}
  <form action="{% url 'blogs:new_blog' %}" method='post'>
    {% csrf_token %}
    {{ form.as_div }}
    <button name="submit" class="btn btn-outline-secondary mt-3">
        Add topic
    </button>
  </form>
{% endblock content %}
